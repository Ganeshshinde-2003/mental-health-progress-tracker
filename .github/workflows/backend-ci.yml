name: Backend CI

on:
  push:
    branches: [main]
    paths: ['server/**']
  pull_request:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch:

jobs:
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      TURSO_DATABASE_URL: libsql://ci-placeholder.turso.io
      TURSO_AUTH_TOKEN: ci-placeholder-token
      FIREBASE_PROJECT_ID: ci-placeholder
      FIREBASE_CLIENT_EMAIL: ci-placeholder@ci-placeholder.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
